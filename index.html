<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店舗チェックシート</title>
<style>
  :root{
    --bg:#F7F5EF;
    --card:#FFFFFF;
    --ink:#2B2B27;
    --sub:#726F66;
    --line:#E4E0D4;
    --teal:#1F4D3D;
    --teal-dark:#153A2E;
    --amber:#C98A3E;
    --danger:#B4453A;
    --done:#1F4D3D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.6;
    padding:0 0 60px;
    min-height:100vh;
  }
  header{
    padding:28px 20px 12px;
    text-align:center;
  }
  header h1{
    font-size:19px;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:.02em;
  }
  header p{
    font-size:12px;
    color:var(--sub);
    margin:0;
  }
  .admin-link{
    display:block;
    text-align:center;
    font-size:12px;
    color:var(--sub);
    margin-bottom:8px;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:0 16px;
  }
  .loading{
    text-align:center;
    color:var(--sub);
    font-size:13px;
    padding:40px 0;
  }

  .select-screen{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-top:16px;
  }
  .mode-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 20px;
    cursor:pointer;
    transition:border-color .15s, transform .1s;
    text-align:left;
  }
  .mode-btn:active{transform:scale(.98);}
  .mode-btn.open{border-left:4px solid var(--amber);}
  .mode-btn.close{border-left:4px solid var(--teal);}
  .mode-btn .label{
    font-size:17px;
    font-weight:700;
  }
  .mode-btn .desc{
    font-size:12px;
    color:var(--sub);
    margin-top:3px;
  }
  .mode-btn .arrow{
    font-size:20px;
    color:var(--sub);
  }

  .check-screen{display:none;}
  .check-screen.active{display:block;}
  .select-screen.hidden{display:none;}
  .weather-screen{display:none;}
  .weather-screen.active{display:block;}
  .weather-screen .topbar{margin-top:16px;}
  .weather-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 20px;
    cursor:pointer;
    margin-bottom:12px;
    text-align:left;
  }
  .weather-btn:active{transform:scale(.98);}
  .weather-btn.sunny{border-left:4px solid #E0A72E;}
  .weather-btn.rainy{border-left:4px solid #4A7FB5;}
  .weather-btn .label{font-size:16px; font-weight:700;}

  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0 14px;
  }
  .back-btn{
    background:none;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 12px;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
  }
  .mode-title{
    font-size:16px;
    font-weight:700;
    flex:1;
  }
  .mode-title.open-color{color:var(--amber);}
  .mode-title.close-color{color:var(--teal);}

  .progress{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .progress-bar{
    flex:1;
    height:6px;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--teal);
    width:0%;
    transition:width .2s;
  }
  .progress-num{
    font-size:12px;
    color:var(--sub);
    white-space:nowrap;
    min-width:44px;
    text-align:right;
  }

  .item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 14px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .item.checked{
    border-color:var(--done);
    background:#EEF4EF;
  }
  .checkbox{
    flex-shrink:0;
    width:22px;
    height:22px;
    border-radius:6px;
    border:2px solid #B9B6AA;
    margin-top:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all .12s;
  }
  .item.checked .checkbox{
    background:var(--done);
    border-color:var(--done);
  }
  .checkbox svg{
    width:14px;
    height:14px;
    opacity:0;
    transition:opacity .12s;
  }
  .item.checked .checkbox svg{opacity:1;}
  .item-text{
    font-size:14px;
    padding-top:1px;
  }
  .item-num{
    color:var(--sub);
    margin-right:1px;
  }
  .item-photo{
    margin:-2px 0 10px;
  }
  .item-photo img{
    width:100%;
    height:auto;
    border-radius:10px;
    border:1px solid var(--line);
    display:block;
  }
  .item-note{
    display:flex;
    gap:6px;
    background:#FFF4E5;
    border:1px solid #EAC98A;
    border-radius:8px;
    padding:8px 10px;
    margin:-2px 0 10px;
    font-size:12px;
    color:#7A5A1E;
    line-height:1.5;
  }
  .item-note .icon{flex-shrink:0;}

  .final-confirm{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:#FFF8E8;
    border:1px solid #E8D9A8;
    border-radius:12px;
    padding:14px 14px;
    margin-top:14px;
    cursor:pointer;
  }
  .final-confirm.checked{
    background:#EEF4EF;
    border-color:var(--done);
  }
  .final-confirm .checkbox{
    flex-shrink:0;
    width:22px;
    height:22px;
    border-radius:6px;
    border:2px solid #B9B6AA;
    margin-top:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all .12s;
  }
  .final-confirm.checked .checkbox{
    background:var(--done);
    border-color:var(--done);
  }
  .final-confirm .checkbox svg{
    width:14px;
    height:14px;
    opacity:0;
    transition:opacity .12s;
  }
  .final-confirm.checked .checkbox svg{opacity:1;}
  .final-confirm-text{
    font-size:13px;
    font-weight:700;
    padding-top:1px;
  }

  .copy-btn{
    width:100%;
    margin-top:18px;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:background .15s, opacity .15s;
    color:#fff;
  }
  .copy-btn.enabled{background:var(--teal);}
  .copy-btn.enabled:active{background:var(--teal-dark);}
  .copy-btn.disabled{
    background:#C9C6BA;
    cursor:not-allowed;
  }
  .hint{
    text-align:center;
    font-size:12px;
    color:var(--sub);
    margin-top:10px;
  }
  .hint.warn{color:var(--danger);}

  .toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:12px 20px;
    border-radius:10px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <h1>店舗チェックシート</h1>
  <p>写真チェック項目 / LINE報告用</p>
</header>
<a class="admin-link" href="admin.html">項目を編集する(管理サイト)</a>

<div class="wrap">

  <div class="loading" id="loading">読み込み中...</div>

  <div class="select-screen hidden" id="selectScreen">
    <div class="mode-btn open" onclick="showWeatherScreen('open')">
      <div>
        <div class="label" id="openLabel">オープンチェック</div>
        <div class="desc" id="openDesc"></div>
      </div>
      <div class="arrow">›</div>
    </div>
    <div class="mode-btn close" onclick="showWeatherScreen('close')">
      <div>
        <div class="label" id="closeLabel">クローズチェック</div>
        <div class="desc" id="closeDesc"></div>
      </div>
      <div class="arrow">›</div>
    </div>
  </div>

  <div class="weather-screen" id="weatherScreen">
    <div class="topbar">
      <button class="back-btn" onclick="showSelect()">← 戻る</button>
      <div class="mode-title" id="weatherModeTitle"></div>
    </div>
    <div class="weather-btn sunny" onclick="selectWeather('sunny')">
      <div class="label">☀ 晴れ</div>
      <div class="arrow">›</div>
    </div>
    <div class="weather-btn rainy" onclick="selectWeather('rainy')">
      <div class="label">☂ 雨の可能性あり</div>
      <div class="arrow">›</div>
    </div>
  </div>

  <div class="check-screen" id="checkScreen">
    <div class="topbar">
      <button class="back-btn" onclick="showWeatherScreen()">← 戻る</button>
      <div class="mode-title" id="modeTitle"></div>
    </div>

    <div class="progress">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-num" id="progressNum">0/0</div>
    </div>

    <div id="itemList"></div>

    <div class="final-confirm" id="finalConfirm1" onclick="toggleFinalConfirm(1)">
      <div class="checkbox" id="finalCheckbox1"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
      <div class="final-confirm-text">全ての項目の写真を撮影し、LINEに送信しました</div>
    </div>

    <div class="final-confirm" id="finalConfirm2" onclick="toggleFinalConfirm(2)">
      <div class="checkbox" id="finalCheckbox2"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
      <div class="final-confirm-text">チェックポイントが写真にきちんと写っていることを確認しました</div>
    </div>

    <button class="copy-btn disabled" id="copyBtn" onclick="doCopy()">コピー</button>
    <div class="hint warn" id="hintText">未チェックの項目があります</div>
  </div>

</div>

<div class="toast" id="toast">LINEにコピーしました</div>

<script src="config.js"></script>
<script>
let DATA = null;
let currentMode = null;
let currentWeather = null;
let checkedState = {};
let finalConfirmed1 = false;
let finalConfirmed2 = false;

async function init(){
  try{
    DATA = await loadChecklistData();
  }catch(e){
    console.error(e);
    DATA = (typeof DEFAULT_DATA !== 'undefined') ? JSON.parse(JSON.stringify(DEFAULT_DATA)) : null;
  }
  if(!DATA){
    document.getElementById('loading').textContent = '読み込みに失敗しました。config.jsが正しく読み込まれているか確認してください。';
    return;
  }
  document.getElementById('openDesc').textContent = '打刻後15分以内';
  document.getElementById('closeDesc').textContent = '閉店後30分以内';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('selectScreen').classList.remove('hidden');
}
init();

function showSelect(){
  document.getElementById('selectScreen').classList.remove('hidden');
  document.getElementById('weatherScreen').classList.remove('active');
  document.getElementById('checkScreen').classList.remove('active');
  currentMode = null;
  currentWeather = null;
}

function showWeatherScreen(mode){
  if(mode) currentMode = mode;
  document.getElementById('selectScreen').classList.add('hidden');
  document.getElementById('checkScreen').classList.remove('active');
  document.getElementById('weatherScreen').classList.add('active');
  document.getElementById('weatherModeTitle').textContent = DATA[currentMode].title;
}

function selectWeather(weather){
  currentWeather = weather;
  document.getElementById('weatherScreen').classList.remove('active');
  showCheck();
}

function showCheck(){
  checkedState = {};
  finalConfirmed1 = false;
  finalConfirmed2 = false;
  document.getElementById('finalConfirm1').classList.remove('checked');
  document.getElementById('finalConfirm2').classList.remove('checked');
  const meta = DATA[currentMode];
  const data = meta.weather[currentWeather];

  document.getElementById('checkScreen').classList.add('active');

  const titleEl = document.getElementById('modeTitle');
  const weatherLabel = currentWeather === 'sunny' ? '☀ 晴れ' : '☂ 雨の可能性あり';
  titleEl.textContent = meta.title + '(' + weatherLabel + ')';
  titleEl.className = 'mode-title ' + (currentMode === 'open' ? 'open-color' : 'close-color');

  const list = document.getElementById('itemList');
  list.innerHTML = '';
  data.items.forEach((item, i) => {
    checkedState[i] = false;
    const displayText = item.label ? (item.label + ' ' + item.detail) : item.detail;
    const el = document.createElement('div');
    el.className = 'item';
    el.id = 'item-' + i;
    el.onclick = () => toggleItem(i);
    el.innerHTML =
      '<div class="checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>' +
      '<div class="item-text"><span class="item-num">' + item.num + '.</span>' + displayText + '</div>';
    list.appendChild(el);

    if(item.note){
      const noteDiv = document.createElement('div');
      noteDiv.className = 'item-note';
      noteDiv.innerHTML = '<span class="icon">⚠️</span><span>' + escapeHtml(item.note) + '</span>';
      list.appendChild(noteDiv);
    }

    if(item.photo){
      const photoDiv = document.createElement('div');
      photoDiv.className = 'item-photo';
      const img = document.createElement('img');
      img.src = item.photo;
      img.alt = displayText;
      img.loading = 'lazy';
      img.onclick = (ev) => { ev.stopPropagation(); window.open(item.photo, '_blank'); };
      photoDiv.appendChild(img);
      list.appendChild(photoDiv);
    }
  });

  updateProgress();
}

function toggleItem(i){
  checkedState[i] = !checkedState[i];
  const el = document.getElementById('item-' + i);
  el.classList.toggle('checked', checkedState[i]);
  updateProgress();
}

function toggleFinalConfirm(n){
  if(n === 1){
    finalConfirmed1 = !finalConfirmed1;
    document.getElementById('finalConfirm1').classList.toggle('checked', finalConfirmed1);
  } else {
    finalConfirmed2 = !finalConfirmed2;
    document.getElementById('finalConfirm2').classList.toggle('checked', finalConfirmed2);
  }
  updateProgress();
}

function updateProgress(){
  const total = Object.keys(checkedState).length;
  const done = Object.values(checkedState).filter(Boolean).length;
  document.getElementById('progressNum').textContent = done + '/' + total;
  document.getElementById('progressFill').style.width = (total ? (done/total*100) : 0) + '%';

  const btn = document.getElementById('copyBtn');
  const hint = document.getElementById('hintText');
  const allItemsChecked = total > 0 && done === total;
  const allChecked = allItemsChecked && finalConfirmed1 && finalConfirmed2;

  if(allChecked){
    btn.className = 'copy-btn enabled';
    hint.textContent = 'タップしてLINEにコピー';
    hint.classList.remove('warn');
  } else if(!allItemsChecked){
    btn.className = 'copy-btn disabled';
    hint.textContent = '未チェックの項目があります(' + (total-done) + '件)';
    hint.classList.add('warn');
  } else {
    btn.className = 'copy-btn disabled';
    hint.textContent = '下の2つの確認欄にチェックしてください';
    hint.classList.add('warn');
  }
}

function buildText(){
  const meta = DATA[currentMode];
  const data = meta.weather[currentWeather];
  const weatherLabel = currentWeather === 'sunny' ? '晴れ' : '雨の可能性あり';
  const today = new Date();
  const dateLabel = (today.getMonth()+1) + '/' + today.getDate() + '(' + ['日','月','火','水','木','金','土'][today.getDay()] + ')';
  let lines = [];
  lines.push(dateLabel);
  lines.push(meta.header);
  lines.push('');
  lines.push('天気:' + weatherLabel);
  lines.push('写真枚数:' + data.photoCount);
  lines.push('');

  const groups = [];
  const groupMap = {};
  data.items.forEach(item => {
    if(!groupMap[item.num]){
      groupMap[item.num] = { num:item.num, label:item.label, details:[] };
      groups.push(groupMap[item.num]);
    }
    groupMap[item.num].details.push(item.detail);
  });

  groups.forEach(g => {
    if(g.label){
      lines.push(g.num + '.' + g.label);
      g.details.forEach(d => lines.push('・' + d));
    } else if(g.details.length === 1){
      lines.push(g.num + '.' + g.details[0]);
    } else {
      lines.push(g.num + '.');
      g.details.forEach(d => lines.push('・' + d));
    }
  });

  lines.push('');
  lines.push('写真と文章に書かれた内容を照らし合わせ、確認ができる状態になっている事も含めて、問題がないことを確認しました。');
  return lines.join('\n');
}

function doCopy(){
  const total = Object.keys(checkedState).length;
  const done = Object.values(checkedState).filter(Boolean).length;
  if(done !== total || total === 0 || !finalConfirmed1 || !finalConfirmed2) return;

  const text = buildText();
  const showToast = () => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  };

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showToast).catch(() => fallbackCopy(text, showToast));
  } else {
    fallbackCopy(text, showToast);
  }
}

function escapeHtml(str){
  return (str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); cb(); } catch(e){}
  document.body.removeChild(ta);
}
</script>

</body>
</html>
