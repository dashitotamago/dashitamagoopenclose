<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チェックシート管理</title>
<style>
  :root{
    --bg:#F7F5EF;
    --card:#FFFFFF;
    --ink:#2B2B27;
    --sub:#726F66;
    --line:#E4E0D4;
    --teal:#1F4D3D;
    --teal-dark:#153A2E;
    --amber:#C98A3E;
    --danger:#B4453A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.6;
    padding:0 0 80px;
  }
  header{
    padding:24px 20px 12px;
    text-align:center;
  }
  header h1{
    font-size:18px;
    font-weight:700;
    margin:0 0 4px;
  }
  header p{
    font-size:12px;
    color:var(--sub);
    margin:0;
  }
  .back-link{
    display:block;
    text-align:center;
    font-size:12px;
    color:var(--sub);
    margin-bottom:12px;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:0 16px;
  }
  .loading{
    text-align:center;
    color:var(--sub);
    font-size:13px;
    padding:40px 0;
  }

  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    color:var(--sub);
  }
  .tab.active.open{border-color:var(--amber); color:var(--amber); background:#FBF2E6;}
  .tab.active.close{border-color:var(--teal); color:var(--teal); background:#EAF2EE;}

  .subtabs{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .subtab{
    flex:1;
    text-align:center;
    padding:8px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    color:var(--sub);
  }
  .subtab.active.sunny{border-color:#E0A72E; color:#B5820F; background:#FBF2E0;}
  .subtab.active.rainy{border-color:#4A7FB5; color:#3A6690; background:#E9F0F7;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    margin-bottom:14px;
  }
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--sub);
    margin-bottom:5px;
  }
  .field input, .field textarea{
    width:100%;
    padding:9px 10px;
    font-size:14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:56px;}

  .item-row{
    display:grid;
    grid-template-columns:44px 1fr 1fr auto;
    gap:6px;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .item-row:last-child{border-bottom:none;}
  .item-row input{
    padding:8px 8px;
    font-size:13px;
    border:1px solid var(--line);
    border-radius:7px;
    width:100%;
  }
  .row-actions{
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .icon-btn{
    background:none;
    border:1px solid var(--line);
    border-radius:6px;
    width:26px;
    height:26px;
    font-size:12px;
    cursor:pointer;
    color:var(--sub);
    line-height:1;
  }
  .icon-btn.danger{color:var(--danger); border-color:var(--danger);}

  .item-block{
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .item-block:last-child{border-bottom:none;}
  .photo-row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-top:6px;
  }
  .photo-row input[type="file"]{
    display:none;
  }
  .photo-upload-btn{
    flex:1;
    padding:8px 10px;
    font-size:12px;
    border:1px dashed var(--line);
    border-radius:7px;
    background:none;
    color:var(--sub);
    cursor:pointer;
    text-align:center;
  }
  .photo-remove-btn{
    background:none;
    border:1px solid var(--line);
    border-radius:6px;
    width:26px;
    height:26px;
    font-size:12px;
    cursor:pointer;
    color:var(--danger);
    flex-shrink:0;
    display:none;
  }
  .photo-remove-btn.show{display:block;}
  .photo-preview{
    width:40px;
    height:40px;
    border-radius:6px;
    border:1px solid var(--line);
    object-fit:cover;
    flex-shrink:0;
    display:none;
  }
  .photo-preview.show{display:block;}

  .add-btn{
    width:100%;
    margin-top:12px;
    padding:10px;
    border:1px dashed var(--line);
    border-radius:8px;
    background:none;
    color:var(--teal);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }

  .save-bar{
    position:sticky;
    bottom:0;
    background:var(--bg);
    padding:14px 0 4px;
  }
  .field.key{margin-bottom:10px;}
  .save-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    background:var(--teal);
    color:#fff;
  }
  .save-btn:active{background:var(--teal-dark);}
  .status{
    text-align:center;
    font-size:12px;
    margin-top:8px;
    min-height:16px;
  }
  .status.ok{color:var(--teal);}
  .status.err{color:var(--danger);}
</style>
</head>
<body>

<header>
  <h1>チェックシート管理</h1>
  <p>項目の追加・編集・削除</p>
</header>
<a class="back-link" href="index.html">← チェックサイトに戻る</a>

<div class="wrap">
  <div class="loading" id="loading">読み込み中...</div>

  <div id="editorArea" style="display:none;">
    <div class="tabs">
      <div class="tab open active" id="tabOpen" onclick="switchTab('open')">オープンチェック</div>
      <div class="tab close" id="tabClose" onclick="switchTab('close')">クローズチェック</div>
    </div>

    <div class="card">
      <div class="field">
        <label>見出し(LINE文章の先頭。複数行OK・晴れ/雨共通)</label>
        <textarea id="headerInput"></textarea>
      </div>
    </div>

    <div class="subtabs">
      <div class="subtab sunny active" id="subtabSunny" onclick="switchWeather('sunny')">☀ 晴れ</div>
      <div class="subtab rainy" id="subtabRainy" onclick="switchWeather('rainy')">☂ 雨の可能性あり</div>
    </div>

    <div class="card">
      <div class="field">
        <label>写真枚数の表記</label>
        <input type="text" id="photoCountInput">
      </div>
    </div>

    <div class="card">
      <div id="itemRows"></div>
      <button class="add-btn" onclick="addItem()">＋ 項目を追加</button>
    </div>

    <div class="save-bar">
      <button class="save-btn" onclick="save()">保存する</button>
      <div class="status" id="statusText"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
let DATA = null;
let currentTab = 'open';
let currentWeather = 'sunny';

async function init(){
  try{
    DATA = await loadChecklistData();
  }catch(e){
    console.error(e);
    DATA = (typeof DEFAULT_DATA !== 'undefined') ? JSON.parse(JSON.stringify(DEFAULT_DATA)) : null;
  }
  if(!DATA){
    document.getElementById('loading').textContent = '読み込みに失敗しました。config.jsが正しく読み込まれているか確認してください。';
    return;
  }
  syncIdenticalPhotos();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('editorArea').style.display = 'block';
  renderTab();
}
init();

// 晴れ・雨の内容(場所・グループ名／チェック内容)が同じ項目同士は、写真を同一のものにする
function syncIdenticalPhotos(){
  ['open', 'close'].forEach(cat => {
    const sunnyItems = DATA[cat].weather.sunny.items;
    const rainyItems = DATA[cat].weather.rainy.items;
    const len = Math.min(sunnyItems.length, rainyItems.length);
    for(let i = 0; i < len; i++){
      const s = sunnyItems[i], r = rainyItems[i];
      if(s.label === r.label && s.detail === r.detail){
        if(s.photo && !r.photo) r.photo = s.photo;
        else if(r.photo && !s.photo) s.photo = r.photo;
      }
    }
  });
}

function switchTab(tab){
  currentTab = tab;
  currentWeather = 'sunny';
  document.getElementById('tabOpen').classList.toggle('active', tab === 'open');
  document.getElementById('tabClose').classList.toggle('active', tab === 'close');
  document.getElementById('subtabSunny').classList.add('active');
  document.getElementById('subtabRainy').classList.remove('active');
  renderTab();
}

function switchWeather(weather){
  currentWeather = weather;
  document.getElementById('subtabSunny').classList.toggle('active', weather === 'sunny');
  document.getElementById('subtabRainy').classList.toggle('active', weather === 'rainy');
  renderItems();
}

function renderTab(){
  const meta = DATA[currentTab];
  document.getElementById('headerInput').value = meta.header;
  document.getElementById('photoCountInput').value = meta.weather[currentWeather].photoCount;
  renderItems();
}

function renderItems(){
  const data = DATA[currentTab].weather[currentWeather];
  document.getElementById('photoCountInput').value = data.photoCount;
  const container = document.getElementById('itemRows');
  container.innerHTML = '';
  data.items.forEach((item, i) => {
    const block = document.createElement('div');
    block.className = 'item-block';
    const photoVal = escapeAttr(item.photo || '');
    const previewShow = item.photo ? 'show' : '';
    block.innerHTML =
      '<div class="item-row">' +
        '<input type="number" value="' + item.num + '" onchange="updateItem(' + i + ',\'num\',this.value)" title="番号">' +
        '<input type="text" value="' + escapeAttr(item.label) + '" placeholder="場所・グループ名(任意)" onchange="updateItem(' + i + ',\'label\',this.value)">' +
        '<input type="text" value="' + escapeAttr(item.detail) + '" placeholder="チェック内容" onchange="updateItem(' + i + ',\'detail\',this.value)">' +
        '<div class="row-actions">' +
          '<button class="icon-btn" onclick="moveItem(' + i + ',-1)" title="上へ">↑</button>' +
          '<button class="icon-btn" onclick="moveItem(' + i + ',1)" title="下へ">↓</button>' +
          '<button class="icon-btn danger" onclick="removeItem(' + i + ')" title="削除">×</button>' +
        '</div>' +
      '</div>' +
      '<div class="photo-row">' +
        '<img class="photo-preview ' + previewShow + '" id="preview-' + i + '" src="' + photoVal + '">' +
        '<label class="photo-upload-btn" id="uploadLabel-' + i + '">' +
          (item.photo ? '写真を変更' : '＋ 写真を追加') +
          '<input type="file" accept="image/*" onchange="handlePhotoSelect(' + i + ',this)">' +
        '</label>' +
        '<button class="photo-remove-btn ' + previewShow + '" id="removeBtn-' + i + '" onclick="removePhoto(' + i + ')" title="写真を削除">×</button>' +
      '</div>';
    container.appendChild(block);
  });
}

async function handlePhotoSelect(i, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const label = document.getElementById('uploadLabel-' + i);
  const originalText = label.firstChild.textContent;
  label.firstChild.textContent = 'アップロード中...';
  try{
    const url = await uploadPhoto(file);
    DATA[currentTab].weather[currentWeather].items[i].photo = url;
    syncIdenticalPhotos();
    const preview = document.getElementById('preview-' + i);
    preview.src = url;
    preview.classList.add('show');
    document.getElementById('removeBtn-' + i).classList.add('show');
    label.firstChild.textContent = '写真を変更';
  }catch(e){
    alert(e.message || 'アップロードに失敗しました');
    label.firstChild.textContent = originalText;
  }
  inputEl.value = '';
}

function removePhoto(i){
  const item = DATA[currentTab].weather[currentWeather].items[i];
  item.photo = '';

  // 内容が同じ相方(晴れ⇔雨)の写真も一緒に削除する
  const otherWeather = currentWeather === 'sunny' ? 'rainy' : 'sunny';
  const otherItems = DATA[currentTab].weather[otherWeather].items;
  const other = otherItems[i];
  if(other && other.label === item.label && other.detail === item.detail){
    other.photo = '';
  }

  const preview = document.getElementById('preview-' + i);
  preview.classList.remove('show');
  preview.src = '';
  document.getElementById('removeBtn-' + i).classList.remove('show');
  document.getElementById('uploadLabel-' + i).firstChild.textContent = '＋ 写真を追加';
}

function escapeAttr(str){
  return (str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateItem(i, key, value){
  const item = DATA[currentTab].weather[currentWeather].items[i];
  if(key === 'num'){
    item.num = parseInt(value, 10) || 1;
  } else {
    item[key] = value;
    if(key === 'label' || key === 'detail') syncIdenticalPhotos();
  }
}

function moveItem(i, dir){
  const items = DATA[currentTab].weather[currentWeather].items;
  const j = i + dir;
  if(j < 0 || j >= items.length) return;
  [items[i], items[j]] = [items[j], items[i]];
  renderItems();
}

function removeItem(i){
  DATA[currentTab].weather[currentWeather].items.splice(i, 1);
  renderItems();
}

function addItem(){
  const items = DATA[currentTab].weather[currentWeather].items;
  const lastNum = items.length ? items[items.length - 1].num : 0;
  items.push({ num: lastNum + 1, label: '', detail: '', photo: '' });
  renderItems();
}

async function save(){
  DATA[currentTab].header = document.getElementById('headerInput').value;
  DATA[currentTab].weather[currentWeather].photoCount = document.getElementById('photoCountInput').value;

  const statusEl = document.getElementById('statusText');
  statusEl.textContent = '保存中...';
  statusEl.className = 'status';

  try{
    await saveChecklistData(DATA);
    statusEl.textContent = '保存しました';
    statusEl.className = 'status ok';
  }catch(e){
    statusEl.textContent = e.message || '保存に失敗しました';
    statusEl.className = 'status err';
  }
}
</script>

</body>
</html>
